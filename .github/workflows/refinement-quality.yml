name: Easy refinement validation
on:
  push:
    branches: [development/080-interactive-refinement]
    paths: ['src/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/refinement-quality.yml']
  workflow_dispatch:
permissions:
  # Only used for access-checked UNPUBLISHED private review drafts.
  contents: write
concurrency:
  group: refinement-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      T3CS_PRIVATE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: New-Item -ItemType Directory -Force artifacts/product | Out-Null
      - run: node --test --test-reporter=junit --test-reporter-destination=artifacts/product/unit.xml "tests/*.test.mjs"
      - run: npm run build
      - run: npm run dist:win:portable -- --publish never
      - run: node scripts/verify-distribution.mjs
      - run: node scripts/portable-smoke.mjs
      - name: Full synthetic product workflow with cold reopen and GLB readback
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/product-profile
        run: node scripts/product-test.mjs
      - name: Interactive refinement click history project and GLB roundtrip
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/refinement-profile
        run: node scripts/refinement-test.mjs
      - name: Local source shape and texture repair full user workflow
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/local-repair-profile
        run: |
          node scripts/local-repair-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/local-repair-benchmark.mjs
      - name: Manual brush and geometry full cold-project GLB workflow
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/manual-refinement-profile
        run: |
          node scripts/manual-refinement-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/manual-refinement-benchmark.mjs
      - name: Easy painting direct strokes safe repair and cold export workflows
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/easy-refinement-profile
        run: |
          node scripts/easy-refinement-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/easy-texture-profile"
          node scripts/easy-repair-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/easy-combined-profile"
          node scripts/easy-repair-test.mjs --both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/easy-source-shape-profile"
          node scripts/easy-source-shape-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/environment-clone-material-profile"
          node scripts/surface-retouch-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/environment-clone-atlas-profile"
          node scripts/surface-retouch-test.mjs --atlas --auto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/easy-report.mjs
      - name: Direct texture paint native colors eraser pipette cold export and material seams
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/texture-paint-profile
        run: |
          node scripts/texture-paint-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/texture-paint-seams-profile"
          node scripts/texture-paint-test.mjs --seams
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CS_TEST_PROFILE="$env:RUNNER_TEMP/easy-subtle-profile"
          node scripts/easy-repair-test.mjs --subtle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real user Preview visibility atlas texture geometry and cold export acceptance
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/preview-acceptance-profile
        run: node scripts/preview-acceptance-test.mjs
      - name: Real file dialogs OBJ MTL TGA and source overwrite protection
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/product-desktop-profile
        run: node scripts/desktop-test.mjs
      - name: Imported secondary UV and repeat texture baking
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
        run: |
          node scripts/material-uv-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/repeat-uv-test.mjs
      - name: Original UI workflows
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/product-ui-profile
        run: node scripts/ui-redesign-test.mjs
      - name: Native synthetic fixtures (not gameplay validation)
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
        run: |
          node scripts/native-visual.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-humanoid.mjs
      - name: Detect private regression availability without logging secrets
        id: private
        env:
          NIKKI_DOWNLOAD_URL: ${{ secrets.NIKKI_DOWNLOAD_URL }}
          CHARACTER_TEST_DOWNLOAD_URL: ${{ secrets.CHARACTER_TEST_DOWNLOAD_URL }}
        shell: pwsh
        run: |
          "nikki=$([bool]$env:NIKKI_DOWNLOAD_URL)".ToLower() >> $env:GITHUB_OUTPUT
          "characters=$([bool]$env:CHARACTER_TEST_DOWNLOAD_URL)".ToLower() >> $env:GITHUB_OUTPUT
          "PRIVATE_CHARACTER_DIR=$env:RUNNER_TEMP/product-private" >> $env:GITHUB_ENV
      - name: Private Nikki project integrity and resource measurements
        if: steps.private.outputs.nikki == 'true'
        env:
          NIKKI_DOWNLOAD_URL: ${{ secrets.NIKKI_DOWNLOAD_URL }}
          NIKKI_REVIEW_ROOT: ${{ runner.temp }}/product-private/current-nikki
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
        run: node --use-env-proxy scripts/project-roundtrip-test.mjs
      - name: Private commercial regression inputs
        if: steps.private.outputs.characters == 'true'
        env:
          CHARACTER_TEST_DOWNLOAD_URL: ${{ secrets.CHARACTER_TEST_DOWNLOAD_URL }}
        run: |
          node --use-env-proxy scripts/private-character-download.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/private-character-inventory.py
      - name: Exact beta1 baseline source conversions with same private input
        if: steps.private.outputs.characters == 'true'
        env:
          T3CS_AUTOMATION: '1'
          NIKKI_DOWNLOAD_URL: ${{ secrets.NIKKI_DOWNLOAD_URL }}
          NIKKI_REVIEW_ROOT: ${{ runner.temp }}/product-private/baseline-nikki
        shell: pwsh
        run: |
          $baseline = "$env:RUNNER_TEMP/beta1-source"
          git worktree add --detach $baseline 974a6e6ca07810b8411ff91b61c208e0d09c902d
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          New-Item -ItemType Junction -Path "$baseline/node_modules" -Target (Join-Path $PWD 'node_modules') | Out-Null
          $probe=Join-Path $PWD "scripts/private-character-probe.mjs"
          $nikkiProbe=Join-Path $PWD "scripts/project-roundtrip-test.mjs"
          $savedSha=$env:GITHUB_SHA
          $env:GITHUB_SHA='974a6e6ca07810b8411ff91b61c208e0d09c902d'
          Push-Location $baseline
          try {
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
            node $probe
            if ($LASTEXITCODE -ne 0) { throw 'Baseline probe failed' }
            if ($env:NIKKI_DOWNLOAD_URL) {
              node --use-env-proxy $nikkiProbe
              if ($LASTEXITCODE -ne 0) { throw 'Baseline Nikki regression failed' }
            }
          } finally { Pop-Location; $env:GITHUB_SHA=$savedSha }
          Move-Item "$env:PRIVATE_CHARACTER_DIR/renders" "$env:PRIVATE_CHARACTER_DIR/beta1-renders"
          Move-Item "$env:PRIVATE_CHARACTER_DIR/safe-model-probes.json" "$env:PRIVATE_CHARACTER_DIR/beta1-probes.json"
      - name: Private commercial conversions (no public images)
        if: steps.private.outputs.characters == 'true'
        env:
          T3CS_AUTOMATION: '1'
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
          T3CS_TEST_PROFILE: ${{ runner.temp }}/product-private/profile
          T3CS_RUN_OUTPUT: ${{ runner.temp }}/product-private/runtime
        run: |
          New-Item -ItemType Directory -Force "$env:T3CS_RUN_OUTPUT" | Out-Null
          node scripts/private-character-probe.mjs
      - name: Build beta1 beta2 private comparison
        if: steps.private.outputs.characters == 'true'
        run: node scripts/beta2-compare.mjs
      - name: Prepare synthetic public report and restricted model diagnostics
        env:
          T3CS_PRIVATE_DIAGNOSTICS: '1'
        run: node scripts/product-report.mjs
      - name: Publish access-checked UNPUBLISHED private review
        if: steps.private.outputs.characters == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/private-character-review.mjs
      - name: Package strictly allowlisted public evidence
        run: node scripts/package-product.mjs
      - name: Remove private data
        if: always()
        run: |
          if ($env:PRIVATE_CHARACTER_DIR -and (Test-Path $env:PRIVATE_CHARACTER_DIR)) { Remove-Item -Recurse -Force $env:PRIVATE_CHARACTER_DIR }
      - uses: actions/upload-artifact@v4
        with:
          name: ConversionStudio-easy-refinement-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/Tekken3ConversionStudio-*-x64.exe
            artifacts/easy-refinement/index.html
            artifacts/easy-refinement/results.json
            artifacts/easy-refinement/painted.png
            artifacts/easy-refinement/editor-*.png
            artifacts/easy-repair/results.json
            artifacts/easy-repair/texture-before.png
            artifacts/easy-repair/texture-after.png
            artifacts/easy-combined/results.json
            artifacts/easy-combined/texture-before.png
            artifacts/easy-combined/texture-after.png
            artifacts/easy-source-shape/results.json
            artifacts/easy-source-shape/shape-before.png
            artifacts/easy-source-shape/shape-after.png
            artifacts/surface-retouch/editor-1366.png
            artifacts/surface-retouch/editor-1920.png
            artifacts/surface-retouch/editor-2560.png
            artifacts/surface-retouch/results.json
            artifacts/surface-retouch/environment-before.png
            artifacts/surface-retouch/environment-after.png
            artifacts/surface-retouch/clone-before.png
            artifacts/surface-retouch/clone-after.png
            artifacts/surface-retouch-atlas/editor-1366.png
            artifacts/surface-retouch-atlas/editor-1920.png
            artifacts/surface-retouch-atlas/editor-2560.png
            artifacts/surface-retouch-atlas/results.json
            artifacts/surface-retouch-atlas/environment-before.png
            artifacts/surface-retouch-atlas/environment-after.png
            artifacts/surface-retouch-atlas/clone-before.png
            artifacts/surface-retouch-atlas/clone-after.png
            artifacts/manual-refinement/index.html
            artifacts/manual-refinement/results.json
            artifacts/manual-refinement/benchmark.json
            artifacts/manual-refinement/brush-selection.png
            artifacts/manual-refinement/before.png
            artifacts/manual-refinement/after.png
            artifacts/manual-refinement/wireframe-before.png
            artifacts/manual-refinement/wireframe-after.png
            artifacts/manual-refinement/editor-*.png
            artifacts/local-repairs/index.html
            artifacts/local-repairs/results.json
            artifacts/local-repairs/benchmark.json
            artifacts/local-repairs/damaged.png
            artifacts/local-repairs/shape-before.png
            artifacts/local-repairs/shape-proposal.png
            artifacts/local-repairs/shape-applied.png
            artifacts/local-repairs/shape-profile-before.png
            artifacts/local-repairs/shape-profile-after.png
            artifacts/local-repairs/texture-before.png
            artifacts/local-repairs/texture-proposal.png
            artifacts/local-repairs/editor-*.png
            artifacts/refinement/index.html
            artifacts/refinement/results.json
            artifacts/refinement/editor-*.png
            artifacts/refinement/before.png
            artifacts/refinement/protected.png
            artifacts/product/results.json
            artifacts/product/unit.xml
            artifacts/product/report.html
            artifacts/product/studio-*.png
            artifacts/product/private-summary.json
            artifacts/distribution/verification.json
            artifacts/portable-smoke/windows.json
            artifacts/preview-acceptance/index.html
            artifacts/preview-acceptance/results.json
            artifacts/preview-acceptance/painted.png
            artifacts/preview-acceptance/after-click.png
            artifacts/preview-acceptance/source-before.png
            artifacts/preview-acceptance/source-after.png
            artifacts/preview-acceptance/source-applied.png
            artifacts/preview-acceptance/shape-before.png
            artifacts/preview-acceptance/shape-after.png
            artifacts/preview-acceptance/visible-refusal.png
            artifacts/portable-smoke/paint-preview.png
            artifacts/texture-paint/index.html
            artifacts/texture-paint/results.json
            artifacts/texture-paint/before.png
            artifacts/texture-paint/preview.png
            artifacts/texture-paint/erased.png
            artifacts/texture-paint/editor-*.png
            artifacts/texture-paint-seams/index.html
            artifacts/texture-paint-seams/results.json
            artifacts/texture-paint-seams/before.png
            artifacts/texture-paint-seams/preview.png
            artifacts/texture-paint-seams/erased.png
