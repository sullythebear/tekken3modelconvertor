name: Publish Windows development review
on:
  push:
    branches: [development/070-dev9]
    paths: ["src/**", "scripts/**", "package*.json", ".github/workflows/publish-review.yml", "public-review/evidence-manifest.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: New-Item -ItemType Directory -Force public-review
      - name: Unit and integration checks
        run: node --test --test-reporter=junit --test-reporter-destination=public-review/windows-unit.xml "tests/*.test.mjs"
      - run: npm run build
      - name: Actual Windows Electron import, export and backup IPC
        run: node scripts/desktop-test.mjs
      - run: npm run dist:win:portable
      - run: node scripts/verify-distribution.mjs
      - name: Launch actual portable Windows EXE and exercise import / convert / export
        run: node scripts/portable-smoke.mjs
      - name: Nikki project roundtrip in the actual packaged Windows application
        id: nikki
        continue-on-error: true
        env:
          NIKKI_DOWNLOAD_URL: ${{ secrets.NIKKI_DOWNLOAD_URL }}
          T3CS_PACKAGED_APP: release/win-unpacked/Tekken 3 Conversion Studio.exe
        run: node --use-env-proxy scripts/project-roundtrip-test.mjs
      - name: Collect review without source models or game files
        env:
          NIKKI_OUTCOME: ${{ steps.nikki.outcome }}
        shell: pwsh
        run: |
          Copy-Item artifacts/distribution/verification.json public-review/windows-distribution.json
          Copy-Item artifacts/desktop/runtime.json public-review/windows-desktop.json
          Copy-Item artifacts/portable-smoke/windows.json public-review/windows-portable.json
          Copy-Item artifacts/project-roundtrip/results.json public-review/windows-nikki-project.json
          $bad = Get-ChildItem public-review -Recurse -File | Where-Object { $_.Extension -notin '.png','.html','.json','.xml','.txt','.md' }
          if ($bad) { throw "Unexpected file in public review" }
          node scripts/windows-review-status.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows status report failed" }
          if ($env:NIKKI_OUTCOME -eq 'success') {
            $env:WINDOWS_RECEIPTS = '1'
            node scripts/stage-review-payload.mjs
            if ($LASTEXITCODE -ne 0) { throw "Validated allowlisted payload staging failed" }
            $edgeCandidates = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe")
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Windows offline-report browser unavailable" }
            $env:CHROMIUM_PATH = $edge
            node scripts/review-browser-test.mjs artifacts/review-payload
            if ($LASTEXITCODE -ne 0) { throw "Actual offline Windows report test failed" }
            Copy-Item artifacts/dev9/gallery-browser.json public-review/windows-gallery-browser.json
            node scripts/finalize-review-browser.mjs
            if ($LASTEXITCODE -ne 0) { throw "Windows browser receipt validation failed" }
            node scripts/verify-review-evidence.mjs artifacts/review-payload
            if ($LASTEXITCODE -ne 0) { throw "Evidence byte validation failed" }
            Compress-Archive -Path artifacts/review-payload/* -DestinationPath release/Visual-Review.zip
          } else {
            Write-Warning 'Private project validation failed; no release payload will be published.'
          }
      - name: Publish prerelease and downloadable files
        if: success() && steps.nikki.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^0\.7\.0-dev\.') { throw "Review publishing requires development version" }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Conversion Studio $version — visual review required" --notes-file public-review/REVIEW.md
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) { throw "Release tag belongs to another commit; existing tags are never moved" }
          gh release upload $tag release/Visual-Review.zip "release/Tekken3ConversionStudio-$version-x64.exe" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-development-review
          path: |
            release/*.exe
            release/Visual-Review.zip
            artifacts/review-payload/
            public-review/windows-unit.xml
            public-review/windows-nikki-project.json
            public-review/WINDOWS-STATUS.md
            artifacts/desktop/runtime.json
            artifacts/desktop/*-desktop.png
            artifacts/distribution/verification.json
      - name: Preserve failure status of the private-input project test
        if: always() && steps.nikki.outcome != 'success'
        run: throw 'Nikki project roundtrip did not pass; see the published sanitized measurement report.'
  open-review-pr:
    needs: review
    if: always() && needs.review.result == 'success' && github.ref == 'refs/heads/development/070-dev9'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Open review PR, never merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          existing=$(gh pr list --repo "$GH_REPO" --base main --head development/070-dev9 --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then echo "$existing"; exit 0; fi
          if ! result=$(gh pr create --repo "$GH_REPO" --base main --head development/070-dev9 --title '0.7.0-dev.9: anatomical fingers, source skin transfer and verified contact continuity' --body-file docs/PR_070_DEV9.md 2>&1); then
            echo "::error title=Review PR unavailable::$result"
            exit 1
          fi
          echo "$result"
