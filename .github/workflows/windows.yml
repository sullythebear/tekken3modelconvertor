name: Windows build and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Parse Windows automation scripts
        shell: powershell
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Authored Windows window capture and input test
        shell: powershell
        run: ./scripts/windows/Test-Capture.ps1
      - run: npm test
      - run: npx playwright-core install chromium
      - run: npm run test:visual
      - run: npm run test:reference
      - name: Art presets, project round-trip and simulation shaders
        run: npm run test:art
      - run: npm run test:skinning
      - run: npm run test:mapping
      - run: npm run test:native
      - run: node scripts/desktop-test.mjs
      - run: npm run dist:win
      - run: npm run dist:win:portable
      - run: node scripts/verify-distribution.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tekken3ConversionStudio-Windows
          path: |
            release/*.exe
            release/*.zip
            artifacts/visual/
            artifacts/desktop/
            artifacts/source-mapping/
            artifacts/distribution/
            artifacts/skinning/
            artifacts/reference/
            artifacts/art-director/
            artifacts/windows-capture-fixture-*/
