name: Private multi-character inventory
on:
  push:
    branches: [development/070-multi-character]
    paths: ['src/core/**', 'scripts/private-character-*', 'scripts/private-probe-contract.mjs', 'tests/private-probe-contract.test.mjs', '.github/workflows/private-character-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-character-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize private temporary input directory
        shell: pwsh
        run: |
          $privateRoot = "$env:RUNNER_TEMP/private-character-input"
          New-Item -ItemType Directory -Force "$privateRoot/authored-runtime", "$privateRoot/authored-profile" | Out-Null
          "PRIVATE_CHARACTER_DIR=$privateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "T3CS_AUTOMATION=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "T3CS_RUN_OUTPUT=$privateRoot/authored-runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "T3CS_TEST_PROFILE=$privateRoot/authored-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download private archive without logging the URL
        env:
          CHARACTER_TEST_DOWNLOAD_URL: ${{ secrets.CHARACTER_TEST_DOWNLOAD_URL }}
        run: node --use-env-proxy scripts/private-character-download.mjs
      - name: Bound extraction and inspect actual glTF metadata
        run: python scripts/private-character-inventory.py
      - run: node --test "tests/*.test.mjs"
      - run: npm run build
      - name: Authored repeat-UV pixel and posed-rig regression
        run: node scripts/repeat-uv-test.mjs
      - name: Authored private-render matrix regression
        run: node scripts/private-character-render-test.mjs
      - name: Actual private model imports and conversion diagnostics
        run: node scripts/private-character-probe.mjs
      - name: Publish technical metadata only to a separate diagnostics branch
        shell: pwsh
        run: |
          $ref = 'automation/private-character-diagnostics'
          git ls-remote --exit-code --heads origin $ref 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin "${ref}:refs/remotes/origin/${ref}"
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostics fetch failed' }
            git switch --create $ref --track "origin/$ref"
          } else { git switch --create $ref }
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics checkout failed' }
          New-Item -ItemType Directory -Force docs/private-tests | Out-Null
          Copy-Item "$env:PRIVATE_CHARACTER_DIR/safe-inventory.json" docs/private-tests/inventory.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Copy-Item "$env:PRIVATE_CHARACTER_DIR/safe-model-probes.json" docs/private-tests/model-probes.json
          git add docs/private-tests/inventory.json docs/private-tests/model-probes.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record safe private character archive metadata; no source assets or screenshots'
            if ($LASTEXITCODE -ne 0) { throw 'Metadata commit failed' }
            git push origin "HEAD:refs/heads/$ref"
            if ($LASTEXITCODE -ne 0) { throw 'Metadata push failed' }
          }
      - name: Remove all private data
        if: always()
        shell: pwsh
        run: |
          if ($env:PRIVATE_CHARACTER_DIR -and (Test-Path $env:PRIVATE_CHARACTER_DIR)) { Remove-Item -Recurse -Force $env:PRIVATE_CHARACTER_DIR }
